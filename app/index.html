<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Quill Launcher</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131519'/%3E%3Cpath d='M23.5 7.5c-4.8.6-9 2.8-11.6 6.5-1.7 2.4-2.6 5.3-2.9 8.6l-1.5 2.9 1.2.6 1.5-2.8c3.3-.4 6.1-1.5 8.4-3.4 3-2.5 4.7-6.6 4.9-12.4z' fill='%23fff'/%3E%3C/svg%3E" />

<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <div id="overlays"></div>
  <div class="toast-stack" id="toasts"></div>
  <div id="launch-dock"></div>

  <noscript>
    <div style="padding:40px;font-family:sans-serif;color:#e8eaee;background:#0b0c0e;height:100vh">
      Quill needs JavaScript to render its interface.
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
