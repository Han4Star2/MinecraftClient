name: Build & Release Horus

on:
  push:
    branches:
      - claude/feather-launcher-build-kr7j1e
    paths:
      - 'windows-app/**'
      - 'app/**'
      - 'server/**'
      - 'package.json'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build Horus.exe
        run: |
          cd windows-app
          bash build.sh

      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check if Horus.exe exists
        shell: bash
        run: |
          if [ -f "windows-app/dist/Horus.exe" ]; then
            echo "✓ Horus.exe built successfully"
            ls -lh windows-app/dist/Horus.exe
          else
            echo "✗ Horus.exe not found!"
            find windows-app -name "*.exe" -o -type d -name dist
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: windows-app/dist/Horus.exe
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Horus v${{ steps.version.outputs.version }}
          body: |
            ## Horus Client v${{ steps.version.outputs.version }}

            **Windows Executable (Self-Installing)**
            - Double-click `Horus.exe` to install and launch
            - No separate installer needed
            - Includes all built-in modules, cosmetics system, mod manager, and more

            **Features:**
            - Horus Core: JVM optimization & verified-file cache for fast launches
            - Horus Doctor: Rule-based crash/performance diagnostics
            - Building system: NBT parser for schematics with material lists
            - Progress system: XP, levels, and 15 achievements
            - One-click setup: Playstyle presets (PvP/Survival/Building/Skyblock/Modded)
            - Practice minigames: Aim Trainer & CPS Test
            - Screenshot editor: Blur/pixelate with real canvas manipulation
            - Replay browser: Real Replay-Mod .mcpr file support
            - Setup sync: Export/import your entire configuration
            - Server profiles: Bind instances to game servers
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
